<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O meu site</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: url("https://i.pinimg.com/originals/f7/bc/da/f7bcdade3d34a868e63a10012617699e.gif") center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 40px 20px 8vh;
    }

    .gallery-button {
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 5px;
      background: rgba(0,0,0,.45);
      color: white;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: background .2s, transform .2s;
    }

    .gallery-button:hover {
      background: rgba(0,0,0,.75);
      transform: scale(1.04);
    }
  </style>
</head>

<body>
  <a class="gallery-button" href="galeria.html">
    Ver galeria →
  </a>
